<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado - ENEM Simulado</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <span class="logo">E</span>
      <span>ENEM Simulado</span>
    </a>
    <div class="navbar-nav">
      <a href="index.html" class="nav-link">Início</a>
      <a href="questoes.html" class="nav-link">Questões</a>
      <a href="simulado.html" class="nav-link">Simulado</a>
      <button id="theme-toggle" class="btn btn-ghost btn-icon btn-sm" onclick="App.toggleTheme()">☀</button>
    </div>
  </nav>

  <div class="container">
    <div id="result-content">
      <div class="result-header">
        <h1>Resultado</h1>
        <p>Análise completa do seu desempenho</p>
      </div>

      <div class="score-grid">
        <div class="score-item purple"><div class="score-value" id="res-notation">0</div><div class="score-label">Nota TRI</div></div>
        <div class="score-item blue"><div class="score-value" id="res-total">0</div><div class="score-label">Total</div></div>
        <div class="score-item green"><div class="score-value" id="res-correct">0</div><div class="score-label">Acertos</div></div>
        <div class="score-item red"><div class="score-value" id="res-wrong">0</div><div class="score-label">Erros</div></div>
        <div class="score-item yellow"><div class="score-value" id="res-percentage">0%</div><div class="score-label">Aproveitamento</div></div>
      </div>

      <div id="area-scores" class="score-grid hidden mb-4"></div>

      <div class="card mb-3">
        <div class="card-header"><h3 class="text-sm" style="font-weight:600;">Análise por Dificuldade</h3></div>
        <div class="card-content">
          <div class="score-grid" id="difficulty-analysis"></div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header"><h3 class="text-sm" style="font-weight:600;">Gabarito</h3></div>
        <div class="card-content">
          <div class="flex gap-2 mb-2" style="font-size:0.75rem;">
            <span class="flex items-center gap-1"><span class="gabarito-pip correct" style="width:16px;height:16px;font-size:0.5rem;">✓</span> Acerto</span>
            <span class="flex items-center gap-1"><span class="gabarito-pip incorrect" style="width:16px;height:16px;font-size:0.5rem;">✗</span> Erro</span>
            <span class="flex items-center gap-1"><span class="gabarito-pip" style="width:16px;height:16px;font-size:0.5rem;">—</span> Sem resposta</span>
          </div>
          <div class="gabarito-grid" id="gabarito-grid"></div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header"><h3 class="text-sm" style="font-weight:600;">Detalhamento</h3></div>
        <div class="card-content">
          <div class="flex gap-2 mb-3" id="detail-filters">
            <button class="btn btn-sm btn-primary" data-filter="all" onclick="App.filterDetails('all')">Todas</button>
            <button class="btn btn-sm btn-secondary" data-filter="correct" onclick="App.filterDetails('correct')">Acertos</button>
            <button class="btn btn-sm btn-secondary" data-filter="wrong" onclick="App.filterDetails('wrong')">Erros</button>
          </div>
          <div id="question-details"></div>
        </div>
      </div>

      <div class="flex gap-2 justify-center mt-4 flex-wrap">
        <a href="questoes.html" class="btn btn-primary">Praticar Mais</a>
        <a href="simulado.html" class="btn btn-outline">Simulado</a>
        <a href="index.html" class="btn btn-secondary">Início</a>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="modal modal-wide" id="modal-content"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/tri.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
